stop the line the moment a fault is seen. If managers suppress calls under production pressure or blame people who press the button, usage collapses within weeks. Example escalation times (L1 TL 30–90 seconds, L2 Supervisor 2 minutes, L3 Maintenance 5–10 minutes) are illustrative; confirm real values with the MOS team.", "tips": ["Do not blame the associate who presses the Andon button; appreciate them so defective garments do not move forward.", "Display a named responsible person for each shift and fault type (Quality, Machine, Material, Safety) on the board to avoid shared responsibility.", "Do not reset the signal before recording the Root Cause Analysis (RCA); review SRT data weekly."], "q": [{"q": "How should the associate who pressed Andon be treated?", "o": ["Blame them", "Appreciate them", "Ignore them"]}, {"q": "Before resetting after the issue is solved?", "o": ["Record the RCA", "Nothing", "Close the dashboard"]}]}, {"u": "Designers, 3D technologists, pattern makers, merchandisers", "top": ["Using Browzwear / CLO / Optitex", "MAS Scan Hub: real stretch and drape data", "Stress mapping on inclusive avatars; CLO-SET annotations and virtual sign-off"], "f": "Project lab sessions in a digital sandbox", "k": "More first-time-right samples; less physical sample waste", "risk": "If 3D files are not controlled properly, old versions can reach the cutting and sewing departments.", "tips": ["Use only Digital Twin data with real stretch and drape from the MAS Scan Hub, not generic fabric settings in the software.", "Before cutting physical fabric, check stress/pressure mapping on inclusive avatars and graphic grading to remove fit errors.", "Keep strict naming rules and version control in CLO-SET or Stylezone; release to production only the version with the customer’s virtual sign-off.", "Instead of long emails, exchange feedback with 3D annotations and live notes directly on the 3D model."], "q": [{"q": "What should be released to production?", "o": ["Any version" he officer who approves it (segregation of duties).", "Avoid storing HRIS records containing ID, bank and salary information on unsecured computers or personal devices."], "q": [{"q": "If the Legal Employer is chosen wrongly?", "o": ["Payroll processing can fail", "No effect", "Dashboard updates"]}, {"q": "What is segregation of duties?", "o": ["Separating the person who enters from the person who approves", "One person doing everything", "Deleting data"]}]}, {"u": "TL/GL (basic), office and technical staff", "top": ["Document libraries, permission levels", "Version history, check-in/check-out", "Co-authoring; links instead of email attachments"], "f": "Interactive MS Teams sessions and file-organizing exercises", "k": "Wrong or outdated SOPs and tech packs stop being used", "risk": "SharePoint should be the single source of truth for SOPs, quality audit reports and tech packs.", "tips": ["Stop emailing many copies of one file as attachments; share only the SharePoint link.", "Do not use \"Anyone with the link\"; limit View or Edit access to the relevant people only.", "When editing important SOPs, use Check-out and Version History to prevent accidental data loss."], "q": [{"q": "Best way to share?", "o": ["Email attachment", "SharePoint link (limited permissions)", "Anyone with the link"]}, {"q": "When editing an SOP?", "o": ["Check-out + Version History", "Make several copies", "Save on the desktop"]}]}, {"u": "Office staff, IE, planning, HR, 3D design, managers", "top": ["Prompt: Role + Context + Task + Constraints + Format", "Power BI/Excel/report summaries", "Brand IP and PII protection; human verification"], "f": "Prompt-engineering workshops and Brand IP case studies", "k": "Faster reports; zero Brand IP/PII leaks", "risk": "Protecting the Brand IP of the global brands MAS serves (Victoria’s Secret, Calvin Klein, Marks & Spencer, etc.) is the top priority, so use only IT-approved enterprise AI tools (e.g. Microsoft Copilot with enterprise data protection, CLO AI).", "tips": ["Write prompts as Role + Context + Task + Constraints + Format. Example: \"As an IE in an apparel factory, using the anonymous sewing data below, give a 3-step plan in a table to meet the hourly target.\"", "Never enter unreleased designs, tech packs, prices, MAS Scan Hub data or employee PII into unapproved public AI websites.", "Do not use AI-generated Excel/DAX formulas or reports directly; verify them with human judgment before the final decision (human-in-the-loop)."], "q": [{"q": "What may go into an unapproved public AI site?", "o": ["Unreleased designs", "A general question with nothing confidential", "A tech pack"]}, {"q": "Which is NOT part of prompt structure?", "o": ["Role", "Constraints", "Password"]}]}];I.en={"sub": "Enter your details to start the digital tools training.", "co": "Company", "oth": "Other (type name)", "nm": "Name", "ep": "EPF number", "ly": "Your employee level", "go": "Start training", "note": "Progress is saved on this device only. Training content is based on a MAS factory plan.", "out": "Log out", "hi": "Welcome, ", "prog": "Overall progress", "t1": "Tools", "t2": "Plan", "t3": "Knowledge", "t4": "Certificate", "star": "★ Priority", "done": "Completed ✓", "back": "← Back to tools", "who": "Who", "top": "Training curriculum", "fmt": "Training format", "tips": "Mandatory tips and precautions", "kpi": "Success measure (KPI)", "s1": "I have read and understood the curriculum and tips", "s2": "I have done the practical exercise in the training format", "s3": "I commit to following these tips in my daily work", "shot": "Screenshots", "shotph": "Screenshots coming soon", "ban": "", "ct": "Certificate of Completion", "cb1": "This is to certify that", "cb2": "has successfully completed the priority digital tools training for their employee level.", "cl": "You get the certificate when all ★ priority tools for your level reach 100%. Remaining: ", "pr": "Print / save as PDF", "e1": "Enter the company name.", "e2": "Please enter your name.", "e3": "EPF number must be 3–10 digits.", "tn": "★ = priority tools for your level. For each tool: learn the points, do the exercise, answer the quiz correctly.", "sg": "Congratulations! Training for this tool is complete ✓", "risk": "Why it matters / risks"};LY.en=["Floor-level associates (Operators, Cutters, Mechanics, Helpers)", "Frontline leaders (TL, GL, Supervisors, QC)", "Technical & administrative (IE, PCU, Stores, QA, HR, Designers)", "Factory management"];I.si.risk="ඇයි වැදගත් / අවදානම";I.ta.risk="ஏன் முக்கியம் / அபாயம்";I.si.tips="අනිවාර්ය උපදෙස් සහ පූර්වාරක්ෂක පියවර";I.ta.tips="பின்பற்ற வேண்டிய வழிகாட்டல்கள் (சிங்களத்தில்)";

 $('t2').innerHTML='<div class="card"><h3>Employee levels and priority systems</h3>'+ul(['<b>1. Floor level:</b> Andon, Oracle HCM Self-Service (kiosk/mobile); Dashboard (watching hourly targets)','<b>2. Frontline leaders:</b> Dashboard, Andon escalation/closure, Oracle HCM manager self-service; SAP, SharePoint, simple AI summaries','<b>3. Technical/administrative:</b> SAP, HRIS, 3D Co-creation, SharePoint, AI Prompting','<b>4. Management:</b> Dashboard, Andon SRT analysis, Oracle HCM approvals, AI Prompting'])+'<h3 style="margin-top:14px">Crawl-Walk-Run: 12-week plan (recommended)</h3>'+ul(['<b>Weeks 1–2 Preparation:</b> Train-the-trainer for "Digital Changemakers" (TL/GL); clean HRIS and SAP master data','<b>Weeks 3–5 Pilot line:</b> Andon, Floor Dashboard and Oracle HCM training and live use on one line','<b>Weeks 6–9 Rollout:</b> basic training for other lines; SAP, HRIS, 3D, SharePoint, AI workshops','<b>Weeks 10–12 Stabilize:</b> hypercare and monthly review (Andon SRT, HRIS audit accuracy, dashboard data gap)'])+'</div>';

 $('t3').innerHTML='<div class="card"><h3>වැදගත් දැනුම</h3>'+ul(['MAS: රටවල් 16ක කර්මාන්තශාලා 53ක, සේවකයින් 99,000+ (UiPath සිද්ධි අධ්‍යයනය). Toyota ආභාසය ලත් MAS Operating System (MOS) / Lean සංස්කෘතිය.','සේවක පිරිසෙන් ~80% ක් බිම් මට්ටමේ Associates (IFC 2023). TL/GL පාලම ලෙස ක්‍රියා කරයි, එබැවින් භූමිකාවට අනුව පුහුණුව සකසන්න.','ප්‍රධාන අභියෝගය බය සහ ප්‍රතිරෝධයයි. පද්ධති "රැකියා කප්පාදු මෙවලමක්" ලෙස නොව "නීරස, පුනරාවර්තන වැඩ අඩු කරන සහායකයෙකු" ලෙස සන්නිවේදනය කරන්න.','"Digital Changemakers" සංස්කෘතියක් සහ අත්හදා බලන Sandbox පරිසරයක් බියකින් තොරව ඉගෙනීමට උපකාරී වේ.','සිංහල/දෙමළ තිර රූප සහිත කෙටි අත්පොත් සහ සැබෑ නිෂ්පාදන අවස්ථා ඇසුරින් Sandbox අභ්‍යාස භාවිත කරන්න.','පුහුණුවෙන් පසු Plant Digital Evangelists හරහා පසු විපරම් කර කඩදාසි ක්‍රමවලට ආපසු යාම වළක්වන්න.'])+'<p class="note">Floor Dashboard තිර සැකසුම්, Andon ප්‍රතිචාර කාල, SharePoint ව්‍යුහය සහ AI නීති ප්‍රසිද්ධ නොවේ. දියත් කිරීමට පෙර කර්මාන්තශාලාවේ IT, HR සහ MOS අංශ සමඟ තහවුරු කරගන්න.</p></div>'}
function applyLang(){
 document.documentElement.lang=S.lang;
 document.querySelectorAll('[data-i]').forEach(function(e){e.textContent=t(e.dataset.i)});
 $('co').options[2].text=t('oth');$('co2').placeholder=t('co');
 var v=$('ly').value||0;$('ly').innerHTML=LYN().map(function(x,i){return '<option value="'+i+'">'+x+'</option>'}).join('');$('ly').value=v;
 (S.lang==='en'?tabsEn():tabs());if(t('ban')){['t2','t3'].forEach(function(i){$(i).insertAdjacentHTML('afterbegin','<p class="note">'+t('ban')+'</p>')})}
 document.querySelectorAll('.lang button').forEach(function(b){b.classList.toggle('on',b.dataset.l===S.lang)});
 if(S.user){if(V==='mod')open_(cur);else home()}}
document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){S.lang=b.dataset.l;save();applyLang()}});
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===b)});['t1','t5','t6','t2','t3','t4'].forEach(function(x){$(x).classList.toggle('hide',x!==b.dataset.t)});if(b.dataset.t==='t6')renderProg();if(b.dataset.t==='t4'){fitCert();if(certOK())boom(90)}}});
$('co').onchange=function(){$('co2').classList.toggle('hide',$('co').value!=='_o')};
$('go').onclick=function(){
 var nm=$('nm').value.trim(),ep=$('ep').value.trim(),co=$('co').value==='_o'?$('co2').value.trim():$('co').value;
 if(!co){$('err').textContent=t('e1');return}
 if(nm.length<2){$('err').textContent=t('e2');return}
 if(!/^\d{3,10}$/.test(ep)){$('err').textContent=t('e3');return}
 $('err').textContent='';S.user={co:co,name:nm,epf:ep,ly:+$('ly').value};save();home();welcome()};
$('out').onclick=function(){S.user=null;save();$('nm').value='';$('ep').value='';show('login')};
$('back').onclick=home;
$('wel').onclick=function(){this.classList.add('hide')};
applyLang();
</script></body></html>
